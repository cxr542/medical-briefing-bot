name: Auto release note

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Source PR number to retry (leave empty when reconciling)
        type: string
        required: false
      since:
        description: Reconcile merged PRs since UTC timestamp YYYY-MM-DDTHH:MM:SSZ
        type: string
        required: false
      dry_run:
        description: Read metadata only; do not create branches or PRs
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-note-pr-generation
  cancel-in-progress: false

jobs:
  append-release-note:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release-note') &&
      !startsWith(github.event.pull_request.head.ref, 'automation/release-note/pr-')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out or execute a pull_request_target head or PR artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate or reconcile release note PRs
        uses: actions/github-script@v7
        env:
          SOURCE_PR_NUMBER: ${{ inputs.pr_number }}
          RECONCILE_SINCE: ${{ inputs.since }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { generateNotePR, reconcile } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/medical-briefing-bot/scripts/release-note-automation.mjs`).href);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            try {
              let results;
              if (context.eventName === 'pull_request_target') {
                results = [await generateNotePR({ github, repository, number: context.payload.pull_request.number, dryRun: false })];
              } else {
                const rawNumber = process.env.SOURCE_PR_NUMBER || '';
                const since = process.env.RECONCILE_SINCE || '';
                if (Boolean(rawNumber) === Boolean(since)) throw new Error('Choose exactly one source PR number or cutover timestamp.');
                if (rawNumber && !/^[1-9]\d*$/.test(rawNumber)) throw new Error('Invalid source PR number.');
                const dryRun = process.env.RELEASE_DRY_RUN !== 'false';
                results = rawNumber
                  ? [await generateNotePR({ github, repository, number: Number(rawNumber), dryRun })]
                  : await reconcile({ github, repository, since, dryRun });
              }
              // Never print API exception bodies, tokens, PR bodies, or request headers.
              for (const result of results) core.info(JSON.stringify(result));
              if (results.some(result => result.status === 'needs-review')) core.setFailed('Some source PRs need operator review.');
            } catch (error) {
              if (error.code === 'NEEDS_REVIEW') core.info('NEEDS REVIEW: source/branch state requires operator inspection; no reset or overwrite attempted.');
              core.setFailed('Release note generation stopped safely. Inspect source metadata and branch state; retry without resetting branches.');
            }
