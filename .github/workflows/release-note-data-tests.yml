name: Release note data tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-note-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared parser, schema, preservation and offline API regressions
        run: node --test medical-briefing-bot/tests/test_release_note_guard.mjs medical-briefing-bot/tests/test_release_note_automation.mjs
      - name: Validate committed release note data
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {NOTE_PATH,validateNotes} from './medical-briefing-bot/scripts/release-note-contract.mjs'; validateNotes(JSON.parse(readFileSync(NOTE_PATH,'utf8')));"
      - name: Validate automation PR source, file scope and preserved base data
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { validateNotePullRequest } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/medical-briefing-bot/scripts/release-note-automation.mjs`).href);
            try {
              const result = await validateNotePullRequest({ github, repository: `${context.repo.owner}/${context.repo.repo}`, number: context.payload.pull_request.number });
              core.info(JSON.stringify(result));
            } catch {
              core.setFailed('Release note PR source, schema, or preservation validation failed.');
            }
