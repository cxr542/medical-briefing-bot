name: Comwel HTTP Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run sanitized HTTP diagnostics
        continue-on-error: true
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import re
          import socket
          import subprocess

          import requests

          HOME = "https://total.comwel.or.kr/"
          API = "https://total.comwel.or.kr/api/v1/total/bizsupport/public/mainPageNotice"
          PAYLOAD = {
              "session": {
                  "client_ip": None,
                  "ADMIN_SESSION_VO": None,
                  "SESSION_VO": None,
                  "MENU_ID": None,
                  "MENU_SER": None,
              }
          }
          COLLECTOR_HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json, text/plain, */*",
              "Content-Type": "application/json",
          }
          CHROME_HEADERS = {
              **COLLECTOR_HEADERS,
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
              "Origin": "https://total.comwel.or.kr",
              "Referer": HOME,
          }

          def sanitize_body(text):
              try:
                  value = json.loads(text)
                  if isinstance(value, dict):
                      for key in list(value):
                          if re.search(r"cookie|token|session|auth|secret|credential", key, re.I):
                              value[key] = "[REDACTED]"
                      return json.dumps(value, ensure_ascii=False)[:500]
              except Exception:
                  pass
              text = re.sub(r"(?i)(cookie|set-cookie|authorization|token|session[_-]?id|jwt)\s*[:=]\s*[^,;\s]+", r"\1=[REDACTED]", text)
              return text[:500]

          def show_response(label, response):
              print(f"[{label}] status={response.status_code} final_url={response.url}")
              print(f"[{label}] redirects={len(response.history)} content_type={response.headers.get('Content-Type')} server={response.headers.get('Server')}")
              print(f"[{label}] body={sanitize_body(response.text)}")

          print("=== DNS ===")
          try:
              print("getaddrinfo:")
              for family, _, _, _, address in socket.getaddrinfo("total.comwel.or.kr", 443, type=socket.SOCK_STREAM):
                  print(f"family={family} address={address[0]}")
          except Exception as error:
              print(f"getaddrinfo error={type(error).__name__}: {str(error)[:200]}")
          print("getent:")
          subprocess.run(["getent", "ahosts", "total.comwel.or.kr"], check=False)

          print("=== BASIC GET ===")
          try:
              response = requests.get(HOME, timeout=15, allow_redirects=True)
              show_response("GET", response)
          except Exception as error:
              print(f"[GET] error={type(error).__name__}: {str(error)[:300]}")

          def post(label, headers, session=None):
              try:
                  client = session or requests
                  response = client.post(API, headers=headers, json=PAYLOAD, timeout=15)
                  show_response(label, response)
              except Exception as error:
                  print(f"[{label}] error={type(error).__name__}: {str(error)[:300]}")

          print("=== BASIC POST ===")
          post("POST collector", COLLECTOR_HEADERS)

          print("=== CHROME HEADERS POST ===")
          post("POST chrome-headers", CHROME_HEADERS)

          print("=== SESSION GET THEN POST ===")
          try:
              session = requests.Session()
              response = session.get(HOME, headers=CHROME_HEADERS, timeout=15, allow_redirects=True)
              print(f"[SESSION GET] status={response.status_code} final_url={response.url} cookie_names={sorted(session.cookies.keys())}")
              post("POST session", CHROME_HEADERS, session)
          except Exception as error:
              print(f"[SESSION GET] error={type(error).__name__}: {str(error)[:300]}")

          print("=== IPv4/IPv6 BASIC GET ===")
          for label, family in (("IPv4", "--ipv4"), ("IPv6", "--ipv6")):
              print(f"[{label}]")
              subprocess.run([
                  "curl", "-sS", "-L", family, "--max-time", "20",
                  "-o", "/dev/null", "-w", "status=%{http_code} final_url=%{url_effective} redirects=%{num_redirects}\\n", HOME,
              ], check=False)
          PY
