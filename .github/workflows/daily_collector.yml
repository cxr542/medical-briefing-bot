name: Daily Medical Briefing Collector
run-name: Daily Medical Briefing Collector${{ inputs.recovery_slot && format(' recovery_slot={0}', inputs.recovery_slot) || '' }}

on:
  workflow_dispatch:
    inputs:
      recovery_slot:
        description: Missed KST collection slot recovered by the alert engine
        required: false
        type: string
        default: ''

concurrency:
  group: daily-medical-briefing-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3
      
    - name: 파이썬 3.9 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 파이썬 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r medical-briefing-bot/requirements.txt
        python -m playwright install --with-deps chromium
        
    - name: Install optional keyword boundary dependencies
      continue-on-error: true
      run: python -m pip install -r medical-briefing-bot/requirements-keyword-boundary.txt

    - name: 데이터 수집 및 Supabase 저장 스크립트 실행
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
      run: |
        cd medical-briefing-bot
        python collector.py
