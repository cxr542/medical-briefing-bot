name: Collector Transport Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record curl runtime
        run: curl --version
      - name: Compare exact DailyMedi failure URLs with verified TLS
        run: bash medical-briefing-bot/scripts/dailymedi-tls-diagnostics.sh
