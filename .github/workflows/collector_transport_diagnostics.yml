name: Collector Transport Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install observed collector HTTP versions
        run: python -m pip install requests==2.32.5 urllib3==2.6.3
      - name: Record curl runtime
        run: curl --version
      - name: Compare public endpoint transports on the same runner
        run: python medical-briefing-bot/transport_diagnostics.py
