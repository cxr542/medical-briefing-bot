name: Collector regression tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  parser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 feedparser requests

      - name: Run offline collector parser regression tests
        working-directory: medical-briefing-bot
        run: python -m unittest discover -s tests -v
