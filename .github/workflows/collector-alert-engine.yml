name: Collector Alert Engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate health and log transitions without persisting state
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: collector-alert-engine
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Evaluate collector health and active incidents
        working-directory: medical-briefing-bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALERT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [[ "$ALERT_DRY_RUN" == "true" ]]; then
            node scripts/collector-alert-runner.mjs --dry-run
          else
            node scripts/collector-alert-runner.mjs
          fi
