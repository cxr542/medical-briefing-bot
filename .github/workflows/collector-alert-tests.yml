name: Collector alert engine tests

on:
  pull_request:
    paths:
      - 'medical-briefing-bot/frontend/src/lib/collectorHealthEngine.mjs'
      - 'medical-briefing-bot/frontend/src/lib/collectorAlertEngine.mjs'
      - 'medical-briefing-bot/frontend/src/lib/adminAuth.mjs'
      - 'medical-briefing-bot/frontend/src/lib/adminMonitoringFormatters.mjs'
      - 'medical-briefing-bot/frontend/src/lib/adminSupabase.ts'
      - 'medical-briefing-bot/frontend/src/app/admin/**'
      - 'medical-briefing-bot/frontend/src/app/api/admin/**'
      - 'medical-briefing-bot/frontend/src/app/api/collection-status/**'
      - 'medical-briefing-bot/frontend/src/components/CollectionStatusBanner.tsx'
      - 'medical-briefing-bot/frontend/src/app/page.tsx'
      - 'medical-briefing-bot/collector_runs.sql'
      - 'supabase/migrations/*collector_runs_admin_only.sql'
      - 'medical-briefing-bot/tests/test_admin_security.mjs'
      - 'medical-briefing-bot/tests/test_collector_alert_runner.mjs'
      - 'medical-briefing-bot/tests/test_collector_alert_engine.mjs'
      - 'medical-briefing-bot/tests/fixtures/collector-alert-fetch-mock.mjs'
      - 'medical-briefing-bot/scripts/collector-alert-runner.mjs'
      - '.github/workflows/collector-alert-tests.yml'

permissions:
  contents: read

jobs:
  alert-transitions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run offline alert transition tests
        working-directory: medical-briefing-bot
        run: node --test tests/test_collector_alert_engine.mjs

      - name: Run Alert Engine runner response tests
        working-directory: medical-briefing-bot
        run: node --test tests/test_collector_alert_runner.mjs

      - name: Run Admin auth and Monitoring regression tests
        working-directory: medical-briefing-bot
        run: node --test tests/test_admin_security.mjs
