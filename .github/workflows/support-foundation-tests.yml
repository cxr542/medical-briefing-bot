name: Support foundation checks

on:
  pull_request:
    paths:
      - 'medical-briefing-bot/frontend/**'
      - 'medical-briefing-bot/supabase/**'
      - '.github/workflows/support-foundation-tests.yml'

permissions:
  contents: read

jobs:
  support-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: medical-briefing-bot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medical-briefing-bot/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --experimental-strip-types --test tests/support-rollback-native.mjs
      - run: node --experimental-strip-types --test tests/support-postgrest-native.mjs
      - run: npm run test:support:http
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:support:ui
