<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F8F9FA">
    <title>연결 확인 | 의료 브리핑</title>
    <style>
      :root { color-scheme: light; --background: #F8F9FA; --surface: #FFFFFF; --ink: #191919; --accent: #1D4ED8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--background); color: var(--ink); font: 16px/1.7 Arial, sans-serif; }
      main { width: 100%; max-width: 480px; padding: 32px; border-radius: 32px; background: var(--surface); text-align: center; }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { font-size: 24px; line-height: 1.4; word-break: keep-all; }
      p { word-break: keep-all; }
      a { display: inline-block; padding: 12px 16px; color: var(--accent); text-underline-offset: 4px; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="96" height="96" alt="곰돌이 브리퍼">
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>최신 의료 브리핑을 읽으려면 인터넷 연결이 필요해요. Wi-Fi나 모바일 데이터 연결 후 다시 열어 주세요.</p>
      <a href="/">브리핑 다시 열기</a>
    </main>
  </body>
</html>
